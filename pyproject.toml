[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdem"
version = "0.7.0"
description = "Service Domain Enterprise Metamodel (SDEM): model-driven enterprise architecture metamodel, relationship registry and architecture knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
sdem-validate = "sdem.validate:main"
sdem-diff = "sdem.diff:main"
sdem-trace = "sdem.trace:main"
sdem-graph = "sdem.graph:main"
sdem-infer = "sdem.inference:main"
sdem-eval = "sdem.evaluate:main"
sdem-relationships = "sdem.relationships:main"
sdem-structure = "sdem.structure:main"
sdem-spec = "sdem.spec:main"
sdem-kgspec = "sdem.kgspec:main"
sdem-diagram = "sdem.diagram:main"
sdem-catalogue = "sdem.catalogue:main"
sdem-attributes = "sdem.attributes:main"
sdem-confidence = "sdem.confidence:main"
sdem-logical = "sdem.logical:main"
sdem-physical = "sdem.physical:main"
# Deprecated aliases (SDMM → SDEM, v0.7.0); removed in v0.8.0
sdmm-validate = "sdem.validate:main"
sdmm-diff = "sdem.diff:main"
sdmm-trace = "sdem.trace:main"
sdmm-graph = "sdem.graph:main"
sdmm-engine = "sdem.inference:main"
sdmm-eval = "sdem.evaluate:main"
sdmm-relationships = "sdem.relationships:main"
sdmm-structure = "sdem.structure:main"
sdmm-spec = "sdem.spec:main"
sdmm-kgspec = "sdem.kgspec:main"

[tool.setuptools]
packages = ["sdem", "sdem.data", "sdem.data.schema", "sdem.data.metamodel", "sdmm"]

[tool.setuptools.package-dir]
"sdem.data.schema" = "schema"
"sdem.data.metamodel" = "metamodel"

[tool.setuptools.package-data]
"sdem.data.schema" = ["*.json", "entities/*/*.json"]
"sdem.data.metamodel" = ["*.json"]
