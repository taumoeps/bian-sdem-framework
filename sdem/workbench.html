<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDEM Workbench</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--soft:#f6f8fa;--line:#dfe5eb;--text:#1f2933;--muted:#5f6c7b;--accent:#0f766e;--accent-soft:#e3f5f0;--good:#1f7a3a;--warn:#9a6700;--bad:#b42318;--info:#2563a8;--a1:#b46a2a;--a2:#326da9;--a3:#4b8742;--a4:#7852a0;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f151b;--panel:#151d25;--soft:#1b252f;--line:#2b3946;--text:#e3e9ef;--muted:#9aa8b6;--accent:#3fb8a8;--accent-soft:#16332f;--good:#5fc77d;--warn:#e0b44c;--bad:#f07a6e;--info:#7fb0ea}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:1440px;margin:auto;background:var(--panel);min-height:100vh;border-inline:1px solid var(--line)}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:16px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.segment{display:flex;gap:3px;background:var(--soft);padding:4px;border-radius:9px;border:1px solid var(--line)}.segment a{padding:6px 12px;border-radius:7px;color:var(--text);text-decoration:none}.segment a[aria-current=true]{background:var(--panel);box-shadow:0 1px 4px #0002;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr)}nav{border-right:1px solid var(--line);padding:12px 8px;background:var(--soft)}
nav .lbl{font-size:10px;letter-spacing:.08em;font-weight:800;color:var(--muted);margin:6px 10px 8px}
nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--text);text-decoration:none;margin-bottom:2px}nav a:hover{background:var(--accent-soft)}nav a[aria-current=page]{background:var(--accent-soft);font-weight:700;color:var(--accent)}
main{padding:20px 22px;min-width:0}.bread{font-size:12px;color:var(--muted)}h1{font-size:21px;margin:0 0 4px}h2{font-size:16px;margin:18px 0 8px}h3{font-size:14px;margin:12px 0 6px}.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}a.card{text-decoration:none;color:inherit;display:block}a.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px}.big{font-size:24px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}
.lay{border-left:4px solid var(--line)}.lay.A1{border-left-color:var(--a1)}.lay.A2{border-left-color:var(--a2)}.lay.A3{border-left-color:var(--a3)}.lay.A4{border-left-color:var(--a4)}
.badge{display:inline-block;border:1px solid currentColor;border-radius:5px;padding:0 6px;font-size:11px;font-weight:600;white-space:nowrap}
.b-good{color:var(--good)}.b-warn{color:var(--warn)}.b-bad{color:var(--bad)}.b-info{color:var(--info)}.b-muted{color:var(--muted)}
[role=tablist]{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px}
[role=tab]{border:0;background:none;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer}[role=tab][aria-selected=true]{border-bottom-color:var(--accent);font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}.list{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer}.list button:hover,.list button[aria-pressed=true]{background:var(--accent-soft)}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:8px}select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
pre{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:66vh}
.doc{max-width:820px}.doc h2{border-bottom:1px solid var(--line);padding-bottom:4px}.doc .note{background:var(--soft);color:var(--muted);padding:8px 10px;border-radius:6px}
.cmd{display:flex;gap:6px;align-items:flex-start;margin:6px 0}.cmd code{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;overflow-wrap:anywhere}.cmd button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;cursor:pointer}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}.tree li{margin:4px 0}.rel{font-size:11px;color:var(--muted)}
a.rec{color:var(--accent);text-decoration:none}a.rec:hover{text-decoration:underline}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;margin:2px;background:var(--soft)}
svg text{fill:var(--text);font-size:11px}svg .edge{stroke:var(--muted);stroke-width:1.1;fill:none;opacity:.75}svg .edge.x{stroke:var(--accent);stroke-width:1.6;opacity:1}svg .edge.in{stroke-dasharray:3 3;opacity:.45}
svg .node rect{fill:var(--panel);stroke:var(--line)}svg .node:hover rect,svg .node:focus rect{stroke:var(--accent);stroke-width:2}svg .node{cursor:pointer;outline:none}svg .band{fill:var(--soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
footer{border-top:1px solid var(--line);padding:8px 18px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav .lbl{display:none}nav a{white-space:nowrap}.split{grid-template-columns:1fr}main{padding:14px}}
</style>
</head>
<body><div class="shell">
<header><div class="brand">SDEM Workbench<small>Service Domain Enterprise Metamodel</small></div>
<div class="segment" aria-label="Context" id="ctx"></div><div class="meta" id="meta"></div></header>
<div class="layout"><nav aria-label="Main navigation" id="nav"></nav><main id="main" tabindex="-1"></main></div>
<footer><span id="gen"></span><span id="where"></span></footer>
</div>
<script>
'use strict';
const D=/*DATA*/null, F=D.framework;
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LAYERS=['A1','A2','A3','A4'], TITLES={A1:'A1 Business',A2:'A2 BIAN service domains',A3:'A3 Application',A4:'A4 Technology'};
const FILES={A1:'a1-business.json',A2:'a2-service-domain.json',A3:'a3-application.json',A4:'a4-technology.json'};
const NAV={ws:[['overview','Overview'],['designs','Architecture Designs'],['data','Data Architecture'],['graph','Knowledge Graphs'],['trace','Traceability & Impact'],['reviews','Reviews & Changes'],['documents','Documents & Evidence']],
           fw:[['overview','Overview'],['metamodel','Metamodel Explorer'],['schemas','Schemas & Configuration'],['rules','Relationship Rules'],['health','Engine Health']]};
const REC=Object.fromEntries(D.records.map(r=>[r.id,r])), TYPE=Object.fromEntries(F.types.map(t=>[t.type,t]));
const badge=(w,k)=>`<span class="badge b-${k}">${esc(w)}</span>`;
const SK={approved:'good',confirmed:'good',active:'good',proposed:'info',planned:'info',needs_review:'warn',superseded:'muted',retired:'muted',deprecated:'warn'};
const status=s=>badge(String(s).replaceAll('_',' '),SK[s]||'muted');
const recLink=id=>REC[id]?`<a class="rec" href="#ws/designs/${REC[id].layer}/catalog/${encodeURIComponent(id)}">${esc(REC[id].name)}</a> <span class="muted small">${esc(id)}</span>`:esc(id);
const typeLink=t=>TYPE[t]?`<a class="rec" href="#fw/metamodel/${encodeURIComponent(t)}">${esc(t)}</a>`:esc(t);
const cmd=c=>`<div class="cmd"><code>${esc(c)}</code><button type="button" data-copy="${esc(c)}">Copy</button></div>`;
const head=(t,s)=>`<div class="bread">${route().ctx==='fw'?'SDEM / Framework':esc(D.name)+' / Solution workspace'}</div><h1>${esc(t)}</h1><p class="sub">${esc(s)}</p>`;
function route(){const p=location.hash.slice(1).split('/').map(decodeURIComponent);const ctx=p[0]==='fw'?'fw':'ws';return {ctx,sec:p[1]||'overview',a:p[2]||'',b:p[3]||'',c:p[4]||''}}
function go(h){location.hash=h}
function tabs(items,current){return `<div role="tablist">${items.map(([href,label,key])=>`<button role="tab" aria-selected="${key===current}" tabindex="${key===current?0:-1}" data-go="${esc(href)}">${esc(label)}</button>`).join('')}</div>`}
function render(){const r=route();
  $('#ctx').innerHTML=`<a href="#ws/overview" aria-current="${r.ctx==='ws'}">Solution Workspace</a><a href="#fw/overview" aria-current="${r.ctx==='fw'}">SDEM Framework</a>`;
  $('#meta').innerHTML=(r.ctx==='ws'?[`inputs ${D.fingerprint}`,`generated ${D.generated}`,'graph store '+({current:'current',stale:'out of date',missing:'not built',blocked:'cannot be built'}[(D.graph_state||{}).state]||'state unknown')]:[`metamodel ${F.version}`,`frozen ${F.frozen_at}`]).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  $('#nav').innerHTML=`<div class="lbl">${r.ctx==='ws'?esc(D.name.toUpperCase()):'FRAMEWORK CONSOLE'}</div>`+NAV[r.ctx].map(([k,t])=>`<a href="#${r.ctx}/${k}" ${r.sec===k?'aria-current="page"':''}>${t}</a>`).join('')+(D.home?`<a href="${esc(D.home)}" style="margin-top:14px;color:var(--muted);font-size:12px">← SDEM Home — all workspaces</a>`:'');
  $('#gen').textContent=`Generated by sdem workbench from ${D.name} · ${D.generated} · read-only: decisions are shown as commands for a person to run`;
  const pages=r.ctx==='ws'?{overview,designs,data,graph,trace,reviews,documents}:{overview:fwOverview,metamodel,schemas,rules,health};
  $('#main').innerHTML=(pages[r.sec]||pages.overview)(r);
  $('#where').textContent=(r.ctx==='ws'?'Solution Workspace':'SDEM Framework')+' / '+((NAV[r.ctx].find(x=>x[0]===r.sec)||NAV[r.ctx][0])[1]);
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied'});
  const f=$('#filter'); if(f) f.oninput=()=>{const q=f.value.toLowerCase();document.querySelectorAll('[data-find]').forEach(b=>b.hidden=!b.dataset.find.toLowerCase().includes(q))};
  document.querySelectorAll('select[data-go]').forEach(s=>s.onchange=()=>go(s.dataset.go.replace('{v}',encodeURIComponent(s.value))));
  document.querySelectorAll('[role=tablist]').forEach(tl=>tl.onkeydown=e=>{const t=[...tl.querySelectorAll('[role=tab]')],i=t.indexOf(document.activeElement);if(i<0)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const n=t[(i+(e.key==='ArrowRight'?1:t.length-1))%t.length];n.focus();n.click()}});
  document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('svg .node').forEach(n=>{n.onclick=()=>go(n.dataset.href);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(n.dataset.href)}}});
}
/* ---------- Solution workspace ---------- */
function waiting(){const unconf=LAYERS.reduce((n,l)=>n+(D.docs[l]?D.docs[l].summary.unconfirmed:0),0),open=D.changes.events.filter(e=>!e.planned).length;
  return [[D.review.length,'proposed connections to review','reviews'],[unconf,'inferred records to confirm','designs'],[open,'change events waiting for validation or your acceptance','reviews'],[D.changes.direct_edits.length,'edits made outside SDEM','reviews'],[D.reqs.filter(q=>q.status!=='confirmed').length,'requirements not confirmed','trace']]}
function overview(){
  const missing=D.missing.map(l=>`<div class="card lay ${l}"><div class="small muted">${l} DESIGN</div><h3>${esc(TITLES[l])}</h3><p class="small">${badge('no dataset','warn')} the workspace has no <code>${FILES[l]}</code></p></div>`).join('');
  const gs=D.graph_state||{},gnote=gs.state&&gs.state!=='current'?`<div class="card" style="margin-top:10px"><strong>Knowledge graph ${esc({stale:'out of date',missing:'not built',blocked:'cannot be built'}[gs.state]||gs.state)}</strong><p class="small muted">${esc(gs.reason||'')}</p>${gs.command?cmd(gs.command):''}</div>`:'';
  const cards=D.layers.map(l=>{const c=D.coverage[l.level]||{},pct=c.eligible?Math.round(100*c.linked/c.eligible):100,h=l.errors.length?badge(`${l.errors.length} errors`,'bad'):l.advice.length?badge(`${l.advice.length} advice`,'warn'):badge('passes checks','good');
    return `<a class="card lay ${l.level}" href="#ws/designs/${l.level}/document"><div class="small muted">${l.level} DESIGN</div><h3>${esc(TITLES[l.level])}</h3><div class="big">${l.records}</div><div class="small muted">records · ${pct}% connected to another layer</div><div style="margin-top:6px">${h}</div></a>`}).join('');
  const w=waiting().map(([n,t,s])=>`<a class="card" href="#ws/${s}"><div class="big">${n}</div><div class="small">${esc(t)}</div></a>`).join('');
  return head(D.name,'Solution-design workspace — A1 Business, A2 BIAN, A3 Application and A4 Technology')+`<h2>Architecture designs</h2><div class="grid">${cards}${missing}</div>${gnote}<h2>Waiting on a person</h2><div class="grid">${w}</div>
  <div class="grid" style="margin-top:12px"><a class="card" href="#ws/graph/all"><h3>Knowledge graph</h3><p class="small muted">The four layers and their approved connections.</p></a><a class="card" href="#ws/data/A1/table"><h3>Data architecture</h3><p class="small muted">The datasets, exact JSON and their schema.</p></a><a class="card" href="#fw/overview"><h3>SDEM Framework</h3><p class="small muted">What the metamodel allows — types, links, rules.</p></a></div>`}
function designs(r){const l=LAYERS.includes(r.a)?r.a:'A1',v=['document','catalog','diagram'].includes(r.b)?r.b:'document';
  if(!D.docs[l]) return head('Architecture Designs','')+tabs(LAYERS.map(x=>[`#ws/designs/${x}/${v}`,TITLES[x],x]),l)+`<p class="muted">This workspace has no ${l} dataset (${FILES[l]}).</p>`;
  let body=v==='document'?`<div class="doc">${D.docs[l].html}</div>`:v==='catalog'?catalog(l,r.c):`<p class="small muted">The links stored in the ${l} dataset; select a box for its record. The full graph is under <a class="rec" href="#ws/graph/${l}">Knowledge Graphs</a>.</p>`+graphSvg([l],false);
  return head('Architecture Designs','Human-readable designs, record catalogs and layer diagrams — generated from the workspace.')+tabs(LAYERS.map(x=>[`#ws/designs/${x}/${v}`,TITLES[x],x]),l)+tabs([['document','Document'],['catalog','Catalog'],['diagram','Diagram']].map(([k,t])=>[`#ws/designs/${l}/${k}`,t,k]),v)+body}
function catalog(l,cid){const recs=D.records.filter(x=>x.layer===l),sel=REC[cid]&&REC[cid].layer===l?REC[cid]:recs[0];if(!sel)return `<p class="muted">No ${l} records yet.</p>`;
  const out=D.rels[l].filter(x=>x.source===sel.id),inn=D.rels[l].filter(x=>x.target===sel.id),conn=D.registry.filter(m=>m.source.id===sel.id||m.target.id===sel.id);
  const a=sel.attributes||{},inf=a.inferred,src=a.source_id;
  return `<div class="split"><div><input type="search" id="filter" placeholder="Find a design element by name, id or type" aria-label="Find a record"><div class="list">${recs.map(x=>`<button type="button" data-find="${esc(x.name+' '+x.id+' '+x.type)}" aria-pressed="${x.id===sel.id}" onclick="go('#ws/designs/${l}/catalog/${encodeURIComponent(x.id)}')"><strong>${esc(x.name)}</strong><div class="small muted">${esc(x.type)} · ${esc(x.id)}</div></button>`).join('')}</div></div>
  <div class="card"><div class="small muted">SELECTED · ${typeLink(sel.type)} · ${esc(sel.id)}</div><h2 style="margin-top:2px">${esc(sel.name)}</h2><p>${esc(sel.description||'')}</p>
  <p>${status(sel.lifecycle_status)} ${inf?(inf.status==='confirmed'?badge('confirmed','good'):badge('inferred — not confirmed','warn')):''} ${src?badge('source '+src,'info'):badge('no source recorded','muted')}</p>
  <h3>Within ${l}</h3>${out.concat(inn).length?'<ul>'+out.map(x=>`<li>${esc(x.kind)} → ${recLink(x.target)}</li>`).join('')+inn.map(x=>`<li>${recLink(x.source)} ${esc(x.kind)} → this</li>`).join('')+'</ul>':'<p class="muted">no links inside the layer</p>'}
  <h3>To other layers</h3>${conn.length?'<ul>'+conn.map(m=>`<li>${status(m.status)} ${m.source.id===sel.id?`${esc(m.relationship)} → ${recLink(m.target.id)}`:`${recLink(m.source.id)} ${esc(m.relationship)} → this`} <span class="small muted">${esc(m.mapping_id)}</span></li>`).join('')+'</ul>':'<p class="muted">none in the registry</p>'}
  <p><a class="rec" href="#ws/graph/all/${encodeURIComponent(sel.id)}">In the graph →</a> · <a class="rec" href="#ws/trace/${encodeURIComponent(sel.id)}/rehost">Trace & impact →</a> · <a class="rec" href="#ws/data/${l}/json/${encodeURIComponent(sel.id)}">JSON →</a> · <a class="rec" href="#fw/metamodel/${encodeURIComponent(sel.type)}">Type definition →</a></p></div></div>`}
function data(r){const ds=[...LAYERS,'registry'].includes(r.a)?r.a:'A1',v=['table','json','schema'].includes(r.b)?r.b:'table';
  let body='';
  if(ds==='registry'){body=v==='json'?`<pre>${esc(JSON.stringify(D.registry,null,2))}</pre>`:v==='schema'?`<p>The registry follows the relationship rules: <a class="rec" href="#fw/rules/cross">Relationship Rules → between layers</a>.</p>`:
    `<div class="tw"><table><thead><tr><th>Link</th><th>Source</th><th>Relationship</th><th>Target</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${D.registry.map(m=>`<tr><td>${esc(m.mapping_id)}</td><td>${recLink(m.source.id)}</td><td>${esc(m.relationship)}</td><td>${recLink(m.target.id)}</td><td>${status(m.status)}</td><td class="small">${esc((m.evidence||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`}
  else{const recs=D.records.filter(x=>x.layer===ds),sel=REC[r.c]&&REC[r.c].layer===ds?REC[r.c]:recs[0];
    if(sel&&v==='table') body=`<div class="tw"><table><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Links in layer</th><th>Connections</th></tr></thead><tbody>${recs.map(x=>`<tr><td>${recLink(x.id)}</td><td>${typeLink(x.type)}</td><td>${status(x.lifecycle_status)}</td><td>${D.rels[ds].filter(e=>e.source===x.id||e.target===x.id).length}</td><td>${D.registry.filter(m=>m.source.id===x.id||m.target.id===x.id).length}</td></tr>`).join('')}</tbody></table></div>`;
    if(!sel) body=`<p class="muted">No ${ds} records${D.missing.includes(ds)?' — the workspace has no '+FILES[ds]:''}.</p>`;
    else if(v==='json') body=`<label>Record <select data-go="#ws/data/${ds}/json/{v}">${recs.map(x=>`<option value="${esc(x.id)}" ${x.id===sel.id?'selected':''}>${esc(x.name)} (${esc(x.id)})</option>`).join('')}</select></label><pre>${esc(JSON.stringify(Object.fromEntries(Object.entries(sel).filter(([k])=>k!=='layer')),null,2))}</pre><p class="small muted">Exactly as stored in <code>${FILES[ds]}</code>.</p>`;
    if(sel&&v==='schema'){const used=[...new Set(recs.map(x=>x.type))];body=`<p class="small muted">The ${ds} types this dataset uses, from the metamodel (all ${F.types.filter(t=>t.layer===ds).length} ${ds} types: <a class="rec" href="#fw/metamodel">Metamodel Explorer</a>).</p>`+used.map(t=>typeCard(TYPE[t])).join('')}}
  return head('Data Architecture','The four datasets and the link registry — the source of truth; graphs, pages and documents are derived from them.')+tabs([...LAYERS.map(l=>[`#ws/data/${l}/${v}`,`${l} · ${FILES[l]}`,l]),[`#ws/data/registry/${v}`,'mappings.json','registry']],ds)+tabs([['table','Table'],['json','JSON'],['schema','Schema']].map(([k,t])=>[`#ws/data/${ds}/${k}`,t,k]),v)+body}
function graphSvg(layers,cross,focus){const recs=D.records.filter(x=>layers.includes(x.layer));const W=150,H=30,GX=14,BH=0,pos={};let width=0,y=10;
  const bands=layers.map(l=>{const rs=recs.filter(x=>x.layer===l),perRow=Math.max(6,Math.ceil(Math.sqrt(rs.length*3))),rows=Math.ceil(rs.length/perRow);const top=y;
    rs.forEach((x,i)=>{pos[x.id]={x:110+(i%perRow)*(W+GX),y:top+14+Math.floor(i/perRow)*(H+12)}});width=Math.max(width,110+perRow*(W+GX));y=top+14+rows*(H+12)+18;return {l,top,h:y-top-8}});
  const near=focus?new Set([focus,...D.rels[REC[focus]?.layer||'A1'].filter(e=>e.source===focus||e.target===focus).flatMap(e=>[e.source,e.target]),...D.registry.filter(m=>m.source.id===focus||m.target.id===focus).flatMap(m=>[m.source.id,m.target.id])]):null;
  const line=(a,b,cls,t)=>{const p=pos[a],q=pos[b];if(!p||!q)return'';const x1=p.x+W/2,y1=p.y+H,x2=q.x+W/2,y2=q.y;const dim=near&&!(near.has(a)&&near.has(b))?' style="opacity:.12"':'';
    return `<path class="edge ${cls}"${dim} d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}"><title>${esc(t)}</title></path>`};
  const inner=layers.flatMap(l=>D.rels[l].map(e=>line(e.source,e.target,'in',`${e.source} ${e.kind} ${e.target}`))).join('');
  const x=cross?D.registry.filter(m=>m.status==='approved').map(m=>line(m.source.id,m.target.id,'x',`${m.mapping_id}: ${m.source.id} ${m.relationship} ${m.target.id}`)).join(''):'';
  const bandsSvg=bands.map(b=>`<rect class="band" x="0" y="${b.top}" width="${width}" height="${b.h}" rx="8"/><text x="10" y="${b.top+22}" font-weight="700">${esc(TITLES[b.l])}</text>`).join('');
  const nodes=recs.map(r=>{const p=pos[r.id],dim=near&&!near.has(r.id)?' style="opacity:.25"':'',sel=r.id===focus?' stroke-width="3" style="stroke:var(--accent)"':'';
    return `<g class="node" tabindex="0" role="link" aria-label="${esc(r.name)}" data-href="#ws/designs/${r.layer}/catalog/${encodeURIComponent(r.id)}"${dim}><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="6"${sel}/><text x="${p.x+7}" y="${p.y+19}">${esc(r.name.length>22?r.name.slice(0,21)+'…':r.name)}</text><title>${esc(r.type)} · ${esc(r.id)}</title></g>`}).join('');
  return `<div class="tw"><svg width="${width}" height="${y}" role="img" aria-label="Knowledge graph">${bandsSvg}${inner}${x}${nodes}</svg></div>`}
function graph(r){const scope=LAYERS.includes(r.a)?r.a:'all',focus=REC[r.b]?r.b:'';
  return head('Knowledge Graphs','The federated graph — the four layers joined by approved connections — or one layer at a time.')+
  `<label>Scope <select data-go="#ws/graph/{v}${focus?'/'+encodeURIComponent(focus):''}"><option value="all">All four layers (federated)</option>${LAYERS.map(l=>`<option value="${l}" ${scope===l?'selected':''}>${esc(TITLES[l])}</option>`).join('')}</select></label>
   <label style="margin-left:10px">Focus <select data-go="#ws/graph/${scope}/{v}"><option value="">— none —</option>${D.records.filter(x=>scope==='all'||x.layer===scope).map(x=>`<option value="${esc(x.id)}" ${x.id===focus?'selected':''}>${esc(x.layer)} · ${esc(x.name)}</option>`).join('')}</select></label>
   <div class="legend"><span><svg width="28" height="8"><path class="edge x" d="M0,4 H28"/></svg> approved connection between layers</span><span><svg width="28" height="8"><path class="edge in" d="M0,4 H28"/></svg> link inside a layer</span><span>Proposals are not drawn — they are in <a class="rec" href="#ws/reviews">Reviews & Changes</a>.</span></div>`+
   graphSvg(scope==='all'?LAYERS:[scope],scope==='all',focus)+`<p class="small muted">Built from the workspace's stored links and its approved registry — the same data <code>sdem build</code> writes to the graph store. A real build would use <code>sdem view</code>'s layout.</p>`}
function treeHtml(n,d=0){if(!n||d>6)return'';const ch=(n.children||[]).map(c=>`<li><span class="rel">${esc(c.rel)} · ${esc(c.link||'')}</span><br>${treeHtml(c.node,d+1)}</li>`).join('');return `${recLink(n.id)} ${badge(n.level,'muted')}${ch?`<ul>${ch}</ul>`:''}`}
function trace(r){if(!Object.keys(D.trace).length)return head('Traceability & Impact','')+'<p class="muted">No records yet — nothing to trace.</p>';const id=D.trace[r.a]?r.a:(Object.keys(D.trace)[0]||''),kind=D.kinds.includes(r.b)?r.b:'rehost',t=D.trace[id],imp=(t.impact||{})[kind]||{rows:[]};const CL={design_change_required:'bad',review_required:'warn',no_impact:'good',evidence_incomplete:'muted'};
  return head('Traceability & Impact','Start from an architecture record: what it depends on, what depends on it, and what a change would affect.')+
  `<label>Start record <select data-go="#ws/trace/{v}/${kind}">${D.records.map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.layer)} · ${esc(x.name)}</option>`).join('')}</select></label>
   <label style="margin-left:10px">Change <select data-go="#ws/trace/${encodeURIComponent(id)}/{v}">${D.kinds.map(k=>`<option ${k===kind?'selected':''}>${k}</option>`).join('')}</select></label>
   <div class="split" style="margin-top:12px"><div class="card tree"><h3>Depends on (down)</h3>${treeHtml(t.down)}<h3>Depended on by (up)</h3>${treeHtml(t.up)}</div>
   <div class="card"><h3>Impact of ${esc(kind)}</h3><p class="small muted">${esc(imp.reason||'')}</p><div class="tw"><table><thead><tr><th>Record</th><th>Layer</th><th>Classification</th><th>Via</th></tr></thead><tbody>${imp.rows.map(x=>`<tr><td>${recLink(x.id)}</td><td>${esc(x.level)}</td><td>${badge(String(x.classification).replaceAll('_',' '),CL[x.classification]||'muted')}</td><td class="small">${esc((x.via||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>${(imp.supersede||[]).length?`<p class="small">Links to supersede: ${esc(imp.supersede.join(', '))}</p>`:''}<h3>Requirements and risk for this change</h3>${cmd(`sdem requirements evaluate --workspace ${D.name} --record ${id} --change ${kind} --proposed <new id>`)}</div></div>
   <h2>Requirements</h2><div class="tw"><table><thead><tr><th>Id</th><th>Requirement</th><th>Subject</th><th>Status</th></tr></thead><tbody>${D.reqs.map(q=>`<tr><td>${esc(q.id)}</td><td>${esc(q.name)}</td><td>${recLink(q.subject)}</td><td>${status(q.status)}</td></tr>`).join('')}</tbody></table></div>`}
function reviews(){const ev=D.changes.events;
  return head('Reviews & Changes','Proposed connections, change events and their impact validation, work, and edits made outside SDEM.')+
  `<h2>Proposed connections — weakest first</h2><p class="small muted">Approving is your decision: preview with <code>--dry-run</code>, then run it without.</p>${D.review.length?`<div class="tw"><table><thead><tr><th>Proposal</th><th>Connection</th><th>Rule · confidence</th><th>Evidence needed</th></tr></thead><tbody>${D.review.map(p=>`<tr><td>${esc(p.id)}<br>${badge('proposed','info')}</td><td>${recLink(p.source)} <strong>${esc(p.rel)}</strong> ${recLink(p.target)}<div class="small muted">${esc(p.reasoning)}</div></td><td>${esc(p.rule)} · ${esc(p.confidence)}</td><td>${esc((p.evidence_needed||[]).join(', '))}${cmd(`sdem approve ${p.id} --proposals <ws>/links/proposals.json --workspace ${D.name} --reviewer <you> --evidence ${(p.evidence_needed||['<kind>'])[0]}:<ref> --dry-run`)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">no proposals</p>'}
  <h2>Change events</h2><div class="tw"><table><thead><tr><th>Event</th><th>Change</th><th>By</th><th>Validation</th></tr></thead><tbody>${ev.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.layer)} · ${esc(e.change_set)}</td><td>${esc(e.agent)} for ${esc(e.person)}</td><td>${(e.impact||{}).documentation_only?badge('documentation only','muted'):badge(String(e.validation||'not requested').replaceAll('_',' '),e.planned?'good':'warn')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">none</td></tr>'}</tbody></table></div>
  ${ev.filter(e=>!e.planned&&!(e.impact||{}).documentation_only).map(e=>`<h3>${esc(e.id)} — next step</h3>${cmd(`sdem events validate ${e.id} --workspace ${D.name} --agent sdem-orchestrator --person <you>`)}`).join('')}
  <h2>Work items</h2><p class="muted">${D.changes.work.length||'none'}</p><h2>Edits made outside SDEM</h2><p class="muted">${D.changes.direct_edits.length||'none'}</p>`}
function documents(){const ev={};D.registry.forEach(m=>(m.evidence||[]).forEach(e=>{const [k,...rest]=String(e).split(':');if(k==='engine_rationale')return;(ev[k]=ev[k]||[]).push([rest.join(':'),m.mapping_id])}));
  const srcs=D.records.filter(r=>(r.attributes||{}).source_id);
  return head('Documents & Evidence','The four designs as documents, the source documents records cite, and the evidence behind approved connections.')+
  `<div class="grid">${LAYERS.map(l=>`<a class="card lay ${l}" href="#ws/designs/${l}/document"><div class="small muted">${l} ARCHITECTURE DESIGN</div><h3>${esc(TITLES[l])}</h3><p class="small muted">${D.docs[l]?`${D.docs[l].summary.records} records · ${D.docs[l].gaps.no_connection} without an approved connection`:'no dataset in this workspace'}</p>${cmd(`sdem document --workspace ${D.name} --layer ${l} --format md -o ${l.toLowerCase()}-design.md`)}</a>`).join('')}</div>
  <h2>Source documents</h2>${srcs.length?'<ul>'+srcs.map(r=>`<li>${recLink(r.id)} — ${esc(r.attributes.source_id)}</li>`).join('')+'</ul>':'<p class="muted">No record in this workspace cites a source document (records an agent models from a design document carry <code>source_id: document:&lt;file&gt;#&lt;section&gt;</code>).</p>'}
  <h2>Evidence behind approved connections</h2><div class="tw"><table><thead><tr><th>Kind</th><th>Reference</th><th>Supports</th></tr></thead><tbody>${Object.entries(ev).sort().flatMap(([k,refs])=>refs.map(([ref,id])=>`<tr><td>${esc(k)}</td><td>${esc(ref)}</td><td>${esc(id)}</td></tr>`)).join('')}</tbody></table></div>`}
/* ---------- SDEM framework ---------- */
function typeCard(t){if(!t)return'';return `<div class="card" style="margin-bottom:10px"><div class="small muted">${esc(t.layer)} · ${esc(t.source||'')}${t.abstract?' · abstract':''}${t.extends.length?' · extends '+t.extends.map(esc).join(' → '):''}</div><h3>${esc(t.type)}</h3><p class="small">${esc(t.definition)}</p>
  ${t.attributes.length?`<div class="tw" style="max-height:none"><table><thead><tr><th>Attribute</th><th>Type</th><th>Required</th><th>Allowed / refers to</th></tr></thead><tbody>${t.attributes.map(a=>`<tr><td>${esc(a.name)}${a.deprecated?' '+badge('deprecated','warn'):''}</td><td>${esc(a.type)}</td><td>${a.required?'yes':''}</td><td class="small">${esc((a.allowed_values||[]).join(', ')||(a.refers_to||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">no attributes of its own</p>'}
  ${t.links_out.length?`<p class="small"><strong>Links inside the layer:</strong> ${[...new Set(t.links_out.map(x=>x.kind+' → '+x.to))].map(esc).join('; ')}</p>`:''}${t.cross.length?`<p class="small"><strong>To other layers:</strong> ${t.cross.map(c=>`${esc(c.relationship)} (${c.direction}) ${esc(c.other_end)} — evidence: ${esc(c.evidence_needed.join(', '))}`).join('; ')}</p>`:''}</div>`}
function fwOverview(){const n=l=>F.types.filter(t=>t.layer===l).length;
  return head('SDEM Framework','What the metamodel allows — not the data of a solution.')+`<div class="grid">${LAYERS.map(l=>`<a class="card lay ${l}" href="#fw/metamodel/${l}"><div class="small muted">${l}</div><h3>${esc(TITLES[l])}</h3><div class="big">${n(l)}</div><div class="small muted">entity types</div></a>`).join('')}</div>
  <div class="grid" style="margin-top:10px"><a class="card" href="#fw/rules/within"><div class="big">${F.within.length}</div><div class="small">links allowed inside a layer</div></a><a class="card" href="#fw/rules/cross"><div class="big">${F.cross.length}</div><div class="small">relationships between layers, each with its evidence</div></a><a class="card" href="#fw/health"><div class="big">${F.controls.length}</div><div class="small">controls, where they run, last tested</div></a><a class="card" href="#fw/schemas"><div class="big">${F.schemas.length}</div><div class="small">generated entity schemas</div></a></div>`}
function metamodel(r){const l=LAYERS.includes(r.a)?r.a:'',sel=TYPE[r.a]?TYPE[r.a]:null,layer=sel?sel.layer:(l||'A1');const ts=F.types.filter(t=>t.layer===layer);const cur=sel||ts[0];
  return head('Metamodel Explorer',`Metamodel ${F.version}: every entity type, its attributes, inheritance and allowed links.`)+tabs(LAYERS.map(x=>[`#fw/metamodel/${x}`,`${TITLES[x]} (${F.types.filter(t=>t.layer===x).length})`,x]),layer)+
  `<div class="split"><div><input type="search" id="filter" placeholder="Find a type" aria-label="Find a type"><div class="list">${ts.map(t=>`<button type="button" data-find="${esc(t.type+' '+t.definition)}" aria-pressed="${t.type===cur.type}" onclick="go('#fw/metamodel/${encodeURIComponent(t.type)}')"><strong>${esc(t.type.split('.')[1])}</strong>${t.abstract?' '+badge('abstract','muted'):''}<div class="small muted">${esc(t.definition.slice(0,90))}</div></button>`).join('')}</div></div><div>${typeCard(cur)}<p class="small"><a class="rec" href="#ws/designs/${cur.layer}/catalog">Records of this layer in the workspace →</a></p></div></div>`}
function schemas(){return head('Schemas & Configuration','The installed configuration: metamodel version and freeze, BIAN release, the organisation profile and the generated schemas.')+
  `<div class="grid"><div class="card"><h3>Metamodel</h3><p>${esc(F.version)} · frozen ${esc(F.frozen_at)} by ${esc(F.frozen_by)}</p></div><div class="card"><h3>BIAN</h3><p class="small">${F.bian.length?F.bian.map(esc).join(', '):'no BIAN base installed'} — <code>sdem bian list --base</code></p></div><div class="card"><h3>Organisation profile</h3><p class="small">${D.profile?'this workspace has <code>sdem-profile.json</code> — <code>sdem profile show</code>':'none in this workspace — SDEM\'s core only'}</p></div></div>
  <h2>Generated entity schemas (${F.schemas.length})</h2><div class="tw"><table><thead><tr><th>File</th></tr></thead><tbody>${F.schemas.map(s=>`<tr><td><code>${esc(s)}</code></td></tr>`).join('')}</tbody></table></div>`}
function rules(r){const v=r.a==='cross'?'cross':'within';
  const body=v==='within'?`<input type="search" id="filter" placeholder="Find a rule by type, kind or id" aria-label="Find a rule"><div class="tw"><table><thead><tr><th>Id</th><th>Layer</th><th>Source</th><th>Kind</th><th>Target</th><th>Basis</th></tr></thead><tbody>${F.within.map(c=>`<tr data-find="${esc([c.id,c.level,c.source_type,c.kind,c.target_type].join(' '))}"><td>${esc(c.id)}</td><td>${esc(c.level)}</td><td>${typeLink(c.source_type)}</td><td>${esc(c.kind)}</td><td>${typeLink(c.target_type)}</td><td class="small">${esc(c.basis||'')}</td></tr>`).join('')}</tbody></table></div>`:
   `<div class="tw"><table><thead><tr><th>Relationship</th><th>From</th><th>To</th><th>Cardinality</th><th>Authority</th><th>Evidence a person must give</th></tr></thead><tbody>${F.cross.map(c=>`<tr><td><strong>${esc(c.relationship)}</strong><div class="small muted">${esc(c.direction_semantics||'')}</div></td><td>${typeLink(c.source_type)}</td><td>${typeLink(c.target_type)}</td><td>${esc(c.cardinality)}</td><td class="small">${esc(c.authority)}</td><td class="small">${esc((c.required_evidence||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
  return head('Relationship Rules','The links the metamodel allows inside each layer, and the governed relationships between layers with the evidence each needs.')+tabs([['#fw/rules/within',`Inside a layer (${F.within.length})`,'within'],['#fw/rules/cross',`Between layers (${F.cross.length})`,'cross']],v)+body}
function health(){return head('Engine Health','Generated files, the controls and where each is tested.')+`<div class="card"><h3>Generated files and acceptance cases</h3><p class="small">Checked by maintainers in SDEM's own repository (<code>sdem model check</code>, the test suite) and shown on SDEM Home; this page shows the controls every workspace runs under.</p></div>
  <h2>Controls (${F.controls.length})</h2><div class="tw"><table><thead><tr><th>Id</th><th>Control</th><th>Runs in</th><th>Tested</th><th>Status</th></tr></thead><tbody>${F.controls.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.control)}</td><td class="small">${esc(c.runs)}</td><td>${esc(c.tested)}</td><td>${esc(c.status)}</td></tr>`).join('')}</tbody></table></div>`}
window.addEventListener('hashchange',()=>{render();$('#main').focus({preventScroll:true})});
if(!location.hash) location.replace('#ws/overview'); render();
</script>
</body>
