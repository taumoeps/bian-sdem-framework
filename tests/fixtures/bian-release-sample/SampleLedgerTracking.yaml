openapi: 3.0.1
info:
  title: Sample Ledger Tracking
  description: "A made-up service domain in the shape of a BIAN Semantic API file — not BIAN text."
  contact:
    name: SDEM test
  version: 99.0.0
servers:
  - url: https://example.invalid/sample
paths:
  '/SampleLedgerTracking/Capture':
    post:
      tags:
        - CR - SampleLedgerLog
      summary: Capture
      operationId: Capture
      requestBody:
        $ref: '#/components/requestBodies/SampleLedgerLog'
      responses:
        '200':
          $ref: '#/components/responses/SampleLedgerLog'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    HTTPError:
      type: object
      properties:
        status:
          type: string
    SampleLedgerLog:
      type: object
      properties:
        LedgerReference:
          type: string
        Entry:
          type: string
  responses:
    BadRequest:
      description: BadRequest
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    SampleLedgerLog:
      description: SampleLedgerLog
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SampleLedgerLog'
  requestBodies:
    SampleLedgerLog:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SampleLedgerLog'
      required: true
