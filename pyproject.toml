[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bian-sdmm"
version = "0.2.1"
description = "BIAN Service Domain Mapping Model (SDMM): typed cross-layer architecture mappings and validator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
sdmm-validate = "sdmm.validate:main"
sdmm-diff = "sdmm.diff:main"

[tool.setuptools]
packages = ["sdmm"]
