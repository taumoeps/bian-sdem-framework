name: Validate SDMM
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate (warnings are errors)
        run: python -m sdmm.validate --strict examples/*/mappings.json
      - name: Validate against entity catalogue
        run: python -m sdmm.validate --strict --catalogue examples/card-fraud-alerts/entities.json examples/card-fraud-alerts/mappings.json
      - name: Lifecycle and immutability against previous commit
        run: python -m sdmm.diff --git HEAD~1 examples/*/mappings.json
      - name: Federated graph — check, trace and impact on the fraud example
        run: |
          python -m sdmm.graph check  examples/card-fraud-alerts/a*.json examples/card-fraud-alerts/mappings.json
          python -m sdmm.graph trace  CAP-310 examples/card-fraud-alerts/a*.json examples/card-fraud-alerts/mappings.json
          python -m sdmm.graph impact INF-CLOUD-K8S-PROD --change rehost examples/card-fraud-alerts/a*.json examples/card-fraud-alerts/mappings.json
      - name: Engine harness — baseline proposals validate and score above the floor
        run: |
          python -m sdmm.engine baseline examples/card-fraud-alerts/a*.json > /tmp/proposals.json
          python -m sdmm.validate /tmp/proposals.json
          python -m sdmm.evaluate examples/card-fraud-alerts/mappings.json --proposals /tmp/proposals.json --min-f1 0.5
      - name: Payment Initiation (M1) exports and mappings
        run: |
          python -m sdmm.graph check examples/payment-initiation/a*.json examples/payment-initiation/mappings.json
          python -m sdmm.validate --strict examples/payment-initiation/mappings.json
      - name: Legacy Core Ledger (H1) exports and mappings
        run: |
          python -m sdmm.graph check examples/legacy-core-ledger/a*.json examples/legacy-core-ledger/mappings.json
          python -m sdmm.validate --strict examples/legacy-core-ledger/mappings.json
      - name: Trace the fraud example both ways
        run: |
          python -m sdmm.trace CAP-310 examples/card-fraud-alerts/mappings.json
          python -m sdmm.trace INF-CLOUD-K8S-PROD --direction up --json examples/card-fraud-alerts/mappings.json > /dev/null
      - run: python -m sdmm.validate --json examples/*/mappings.json
      - name: Official-mapping diagram is generated from the JSON
        run: python -m sdmm.diagram --check
      - run: python -m unittest discover -s tests -v
