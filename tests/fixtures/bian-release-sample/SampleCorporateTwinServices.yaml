      description: BadRequest
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    SampleTwinServicesProcedure:
      description: SampleTwinServicesProcedure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SampleTwinServicesProcedure'
  requestBodies:
    SampleTwinServicesProcedure:
