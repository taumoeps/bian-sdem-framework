[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdem"
version = "0.22.0.dev1"
description = "Solution Domain Enterprise Model (SDEM): model-driven enterprise architecture metamodel, relationship registry and architecture knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []
keywords = ["enterprise-architecture", "solution-architecture", "bian", "archimate", "togaf", "architecture-as-code", "knowledge-graph", "metamodel", "traceability", "impact-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Repository = "https://github.com/taumoeps/sdem"
Documentation = "https://github.com/taumoeps/sdem/blob/main/docs/README.md"
Changelog = "https://github.com/taumoeps/sdem/blob/main/CHANGELOG.md"
Issues = "https://github.com/taumoeps/sdem/issues"

[project.scripts]
sdem = "sdem.cli:main"
sdem-validate = "sdem.validate:main"
sdem-diff = "sdem.diff:main"
sdem-trace = "sdem.trace:main"
sdem-graph = "sdem.graph:main"
sdem-infer = "sdem.inference:main"
sdem-aid = "sdem.aid:main"
sdem-transform = "sdem.transform:main"
sdem-load = "sdem.load:main"
sdem-eval = "sdem.evaluate:main"
sdem-relationships = "sdem.relationships:main"
sdem-structure = "sdem.structure:main"
sdem-spec = "sdem.spec:main"
sdem-kgspec = "sdem.kgspec:main"
sdem-diagram = "sdem.diagram:main"
sdem-catalogue = "sdem.catalogue:main"
sdem-attributes = "sdem.attributes:main"
sdem-confidence = "sdem.confidence:main"
sdem-logical = "sdem.logical:main"
sdem-physical = "sdem.physical:main"
sdem-accept = "sdem.acceptance:main"
sdem-metamodel-spec = "sdem.metamodel_spec:main"
sdem-controls = "sdem.controls:main"

[tool.setuptools]
packages = ["sdem", "sdem.data", "sdem.data.schema", "sdem.data.metamodel", "sdem.data.standards", "sdem.data.copilot", "sdem.data.agents", "sdem.data.examples.payment_initiation"]

[tool.setuptools.package-dir]
"sdem.data.schema" = "schema"
"sdem.data.metamodel" = "metamodel"
"sdem.data.standards" = "standards"
"sdem.data.copilot" = ".github"
"sdem.data.agents" = "templates/agents"
"sdem.data.examples.payment_initiation" = "examples/payment-initiation"

[tool.setuptools.package-data]
"sdem" = ["releases.json", "workbench.html", "viewpoints.json"]
"sdem.data.schema" = ["*.json", "entities/*/*.json"]
"sdem.data.metamodel" = ["*.json"]
"sdem.data.standards" = ["*.json"]
"sdem.data.copilot" = ["copilot-instructions.md", "agents/*.md", "prompts/*.md", "skills/*/*"]
"sdem.data.agents" = ["*.md", "*.json"]
"sdem.data.examples.payment_initiation" = ["a1-business.json", "a2-service-domain.json", "a3-application.json", "a4-technology.json", "mappings.json", "requirements.json", "README.md"]
