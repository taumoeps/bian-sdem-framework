name: Validate SDMM
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate (warnings are errors)
        run: python -m sdmm.validate --strict examples/*/mappings.json
      - name: Validate against entity catalogue
        run: python -m sdmm.validate --strict --catalogue examples/card-fraud-alerts/entities.json examples/card-fraud-alerts/mappings.json
      - name: Lifecycle and immutability against previous commit
        run: python -m sdmm.diff --git HEAD~1 examples/*/mappings.json
      - name: Federated graph — check, trace and impact on the fraud example
        run: |
          python -m sdmm.graph check  examples/card-fraud-alerts/a*.json examples/card-fraud-alerts/mappings.json
          python -m sdmm.graph trace  CAP-310 examples/card-fraud-alerts/a*.json examples/card-fraud-alerts/mappings.json
          python -m sdmm.graph impact INF-CLOUD-K8S-PROD --change rehost examples/card-fraud-alerts/a*.json examples/card-fraud-alerts/mappings.json
      - name: Trace the fraud example both ways
        run: |
          python -m sdmm.trace CAP-310 examples/card-fraud-alerts/mappings.json
          python -m sdmm.trace INF-CLOUD-K8S-PROD --direction up --json examples/card-fraud-alerts/mappings.json > /dev/null
      - run: python -m sdmm.validate --json examples/*/mappings.json
      - run: python -m unittest discover -s tests -v
