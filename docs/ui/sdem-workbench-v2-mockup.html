<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDEM Workbench v2 — UX Design Mockup</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202b38;background:#f4f6f8;--bg:#fff;--surface:#f5f7f9;--line:#dfe5eb;--text:#202b38;--muted:#677585;--accent:#0f766e;--accent-soft:#e3f5f0;--a1:#b46a2a;--a2:#326da9;--a3:#4b8742;--a4:#7852a0}
*{box-sizing:border-box}body{margin:0;font-size:13px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #66b8a9;outline-offset:2px}
.shell{max-width:1440px;min-height:100vh;margin:auto;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:15px 19px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800}.mark{background:var(--accent);color:white;padding:7px 11px;border-radius:9px;font-size:20px}.muted{color:var(--muted)}.small{font-size:11px}.segment{display:flex;gap:3px;background:var(--surface);padding:4px;border-radius:8px}.segment button{padding:8px 12px;background:none;border:0;border-radius:6px}.segment button.active{background:#fff;box-shadow:0 1px 5px #172b401c;font-weight:700}.status{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11px}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:700px}.sidebar{border-right:1px solid var(--line);background:#f8fafb;padding:14px 10px}.side-label{margin:15px 10px 8px;font-size:10px;letter-spacing:.08em;font-weight:800;color:var(--muted)}.nav{display:block;width:100%;border:0;background:none;text-align:left;border-radius:8px;padding:10px;font-size:12px;color:var(--text)}.nav:hover{background:#edf2f4}.nav.active{background:var(--accent-soft);color:#075a54;font-weight:800}.nav span{display:inline-block;width:22px}.content{padding:22px;min-width:0}.bread{font-size:11px;color:var(--muted);margin-bottom:4px}h1{font-size:22px;margin:0 0 5px;line-height:1.3}h2{font-size:17px;margin:0 0 9px}h3{font-size:13px;margin:0 0 7px}.page-sub{color:var(--muted);margin:0 0 20px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:15px;margin-bottom:12px}.soft{background:var(--surface)}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.clickable{text-align:left;color:inherit;cursor:pointer;width:100%}.clickable:hover{border-color:var(--accent)}.metric{font-size:27px;font-weight:800;margin:6px 0}.mini{font-size:11px;color:var(--muted)}.btn{background:white;border:1px solid var(--line);border-radius:7px;padding:8px 11px;color:var(--text);font-weight:600}.btn:hover{background:var(--surface)}.btn.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tabs{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid var(--line);padding-bottom:10px;margin:12px 0 17px}.tabs button{border:1px solid transparent;background:none;border-radius:7px;padding:8px 11px;color:var(--text)}.tabs button.active{background:var(--accent-soft);border-color:#b7e0d8;font-weight:750}.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:15px}.list-btn{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);padding:12px;border-radius:8px;margin-bottom:8px;color:var(--text)}.list-btn.selected,.list-btn:hover{background:var(--accent-soft);border-color:var(--accent)}.record-details{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:15px;overflow-wrap:anywhere}.field{border-bottom:1px solid var(--line);padding:9px 0}.field:last-child{border:0}.field label{display:block;color:var(--muted);font-size:10px;letter-spacing:.03em;margin-bottom:3px}.tag{display:inline-block;border:1px solid var(--line);padding:3px 7px;background:var(--surface);border-radius:5px;font-size:10px;margin:3px}.search{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;margin:0 0 10px}.document{max-width:810px;padding:28px 33px;margin:auto;border:1px solid var(--line);border-radius:9px;box-shadow:0 3px 12px #0a284608}.document h2{font-size:22px}.document h3{font-size:15px;margin-top:24px;padding-bottom:7px;border-bottom:1px solid var(--line)}.document p{margin:5px 0 12px}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:580px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--surface);font-size:11px;color:var(--muted)}tr:last-child td{border:0}tr[data-record]{cursor:pointer}tr[data-record]:hover{background:var(--accent-soft)}pre{overflow:auto;background:#15232d;color:#e0f3ed;padding:16px;border-radius:9px;font-size:12px}.notice{padding:12px 14px;border-radius:8px;background:#f0f6f8;color:#526575;font-size:12px;margin:12px 0}.graph{border:1px solid var(--line);background:#f8fafb;border-radius:9px;padding:18px;overflow:auto}.chain{max-width:510px;margin:auto;display:grid;justify-items:stretch;gap:5px}.node{border:1px solid #cbd7df;border-radius:8px;background:white;padding:11px;text-align:center}.node:hover{border-color:var(--accent)}.arrow{text-align:center;color:var(--muted);font-size:11px}.node .pill{display:inline-block;font-size:10px;color:var(--muted)}.source{font-size:10px;color:var(--muted)}.footer{border-top:1px solid var(--line);background:var(--surface);padding:10px 18px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:780px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:4px}.side-label{display:none}.nav{width:auto;white-space:nowrap}.content{padding:14px}.split{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.document{padding:18px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand"><span class="mark">◇</span><div>SDEM Workbench <div class="small muted" style="font-weight:400">Service Domain Enterprise Metamodel</div></div></div><div class="segment" aria-label="Application context"><button data-context="workspace" class="active">Solution Workspace</button><button data-context="framework">SDEM Framework</button></div><span class="status">UX mockup · synthetic data</span></header>
<div class="layout"><nav class="sidebar" id="nav" aria-label="Main navigation"></nav><main class="content" id="main"></main></div>
<footer class="footer"><span>Read-only offline demonstration · No real SDEM commands or approvals</span><span id="where">Solution Workspace / Overview</span></footer></div>
<script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data={
A1:{name:'Business Architecture',intro:'Capabilities, processes, activities and requirements',records:[{id:'CAP-PAY',type:'BusinessCapability',name:'Payment Management',description:'Capability for initiating and managing customer payments.',links:['PRC-PAY','SD-POI']},{id:'PRC-PAY',type:'BusinessProcess',name:'Initiate Customer Payment',description:'Receive and validate a customer request and initiate payment processing.',links:['ACT-PAY','SD-POI']},{id:'ACT-PAY',type:'BusinessActivity',name:'Validate Payment Request',description:'Validate payment details before submission.',links:['SD-POI']},{id:'REQ-PAY',type:'BusinessRequirement',name:'Secure Payment Initiation',description:'Customer payment initiation requires appropriate authentication and authorization.',links:['PRC-PAY']}]},
A2:{name:'BIAN Service Domain Design',intro:'Service domains, service operations and business alignment',records:[{id:'SD-POI',type:'ServiceDomain',name:'Payment Order Initiation',description:'Candidate BIAN domain for payment order initiation.',links:['APP-HUB']},{id:'SD-EXEC',type:'ServiceDomain',name:'Payment Execution',description:'Candidate BIAN domain for payment execution.',links:['CMP-EXEC']},{id:'SO-PAY',type:'ServiceOperation',name:'Initiate Payment',description:'Illustrative operation label, NOT a verified catalogue operation identifier.',links:['API-PAY']}]},
A3:{name:'Application Architecture',intro:'Applications, components, APIs and interfaces',records:[{id:'APP-HUB',type:'Application',name:'Payments Hub',description:'Coordinates payment initiation and execution.',links:['API-PAY','CMP-EXEC','DEP-PROD']},{id:'CMP-EXEC',type:'ApplicationComponent',name:'Payment Execution Component',description:'Processes payment execution requests.',links:['DEP-PROD']},{id:'API-PAY',type:'API',name:'Payment Initiation API',description:'Interface for channels requesting payment initiation.',links:['APP-HUB']}]},
A4:{name:'Technology Architecture',intro:'Platforms, runtime environments and deployments',records:[{id:'INF-AWS',type:'Platform',name:'AWS Production Platform',description:'Illustrative cloud hosting platform.',links:['DEP-PROD']},{id:'DEP-PROD',type:'Deployment',name:'Payments Hub Deployment',description:'Example production deployment of the Payments Hub.',links:['INF-AWS','INF-K8S']},{id:'INF-K8S',type:'Cluster',name:'Kubernetes Cluster',description:'Example container runtime cluster.',links:['DEP-PROD']}]}
};
const layers=Object.keys(data);const all=layers.flatMap(k=>data[k].records.map(r=>({...r,layer:k})));
const definitions={A1:['BusinessCapability','BusinessProcess','BusinessActivity','BusinessRole','BusinessRequirement'],A2:['ServiceDomain','ServiceOperation','BusinessObject'],A3:['Application','ApplicationComponent','API','Interface'],A4:['Platform','Cluster','Deployment','Network']};
const state={context:'workspace',page:'Overview',layer:'A1',view:'Document',dataView:'Table',graphLayer:'All',selected:'CAP-PAY',query:'',metaLayer:'All'};
const nav={workspace:['Overview','Architecture Designs','Data Architecture','Knowledge Graphs','Traceability & Impact','Reviews & Changes','Documents & Evidence'],framework:['Overview','Metamodel Explorer','Schemas & Configuration','Relationship Rules','Engine Health']};
const icon={'Overview':'▦','Architecture Designs':'◇','Data Architecture':'▤','Knowledge Graphs':'◎','Traceability & Impact':'↗','Reviews & Changes':'◷','Documents & Evidence':'▣','Metamodel Explorer':'◇','Schemas & Configuration':'▤','Relationship Rules':'↗','Engine Health':'⚙'};
const find=id=>all.find(r=>r.id===id);
function head(title,description){return `<div class="bread">${state.context==='workspace'?'Payment Initiation / Solution Workspace':'SDEM / Framework'}</div><h1>${esc(title)}</h1><p class="page-sub">${esc(description)}</p>`}
function tabs(values,field){return `<div class="tabs">${values.map(v=>`<button data-${field}="${esc(v)}" class="${state[field]===v?'active':''}">${esc(v)}</button>`).join('')}</div>`}
function selectRecord(id){const r=find(id);if(!r)return;state.context='workspace';state.layer=r.layer;state.selected=id;state.page='Architecture Designs';state.view='Catalog';state.query='';render()}
function details(){const r=find(state.selected)||all[0];return `<aside class="record-details"><div class="mini">SELECTED ENTITY · ${r.layer}</div><h2 style="margin:6px 0 12px">${esc(r.name)}</h2>${[['Identifier',r.id],['Metamodel entity type',r.layer+'.'+r.type],['Description',r.description],['Evidence and status','Illustrative / not approved']].map(([k,v])=>`<div class="field"><label>${k}</label>${esc(v)}</div>`).join('')}<div class="field"><label>Related example records</label>${r.links.map(id=>{const v=find(id);return `<button class="list-btn" style="padding:7px;margin-top:5px" data-record="${esc(id)}">${esc(v?.name||id)} ↗</button>`}).join('')||'None'}</div><div class="actions"><button class="btn" data-page="Knowledge Graphs">View graph</button><button class="btn" data-page="Traceability & Impact">Trace & impact</button></div></aside>`}
function catalog(layer){const arr=data[layer].records.filter(r=>(r.name+' '+r.id+' '+r.type).toLowerCase().includes(state.query.toLowerCase()));return `<div class="split"><div><input id="filter" class="search" value="${esc(state.query)}" placeholder="Find a design element by name or ID" aria-label="Search records">${arr.map(r=>`<button class="list-btn ${state.selected===r.id?'selected':''}" data-record="${esc(r.id)}"><strong>${esc(r.name)}</strong><div class="mini">${esc(layer+'.'+r.type)} · ${esc(r.id)}</div></button>`).join('')||'<p>No matching records.</p>'}</div>${details()}</div>`}
function documentView(layer){const d=data[layer];const sections={A1:[['Business purpose','Support initiation and management of customer payments.'],['Business capabilities', 'Payment Management'],['Processes and activities','Initiate Customer Payment; Validate Payment Request'],['Requirements','Secure Payment Initiation'],['Gaps and assumptions','Detailed customer journeys and exception processing remain undefined.']],A2:[['Service domain purpose','Align business payment initiation to appropriate BIAN Service Domains.'],['Selected domains','Payment Order Initiation; Payment Execution'],['Service operations','Candidate initiation operation (not independently catalogue-verified).'],['Domain relationships','Candidate relationships to the Payments Hub application.'],['Gaps and assumptions','Service operations and domain boundaries require verification.']],A3:[['Application design','Payments Hub coordinates payment initiation and execution.'],['Applications and components','Payments Hub; Payment Execution Component'],['Interfaces and APIs','Payment Initiation API'],['Integrations','Potential links to domain services and technology deployments.'],['Gaps and assumptions','Detailed API contracts, resilience and security specifications are outstanding.']],A4:[['Technology design','Illustrative cloud-hosted runtime for Payments Hub.'],['Platforms','AWS Production Platform'],['Runtime infrastructure','Kubernetes Cluster'],['Deployments','Payments Hub Deployment'],['Gaps and assumptions','Networking, environment configuration and recovery objectives are not yet specified.']]};return `<article class="document"><div class="mini">PAYMENT INITIATION · ${layer} · SYNTHETIC DESIGN</div><h2>${esc(d.name)}</h2><p class="muted">Human-readable draft representation of SDEM workspace entities. Not approved evidence.</p>${sections[layer].map(([title,body],i)=>`<section><h3>${i+1}. ${esc(title)}</h3><p>${esc(body)}</p>${i===1?`<div>${d.records.map(r=>`<button class="tag" data-record="${r.id}">${esc(r.name)} ↗</button>`).join('')}</div>`:''}</section>`).join('')}<div class="notice">The real implementation must generate sections from actual SDEM records with source provenance; this mockup uses authored sample prose.</div></article>`}
function diagram(layer){const rec=data[layer].records;return `<div class="notice">Simplified layer preview. Arrows are not verified SDEM relationship types; no structural relationships are inferred by this mockup.</div><div class="graph"><div class="chain">${rec.map((r,i)=>`${i?'<div class="arrow">↓ illustrative link</div>':''}<button class="node" data-record="${r.id}"><strong>${esc(r.name)}</strong><div class="mini">${esc(layer+'.'+r.type)}</div></button>`).join('')}</div></div>`}
function overview(){return head('Payment Initiation','Solution-design workspace — A1 Business, A2 BIAN, A3 Application and A4 Technology')+`<div class="card soft"><div class="mini">SOLUTION PURPOSE</div><h2 style="margin-top:6px">Customer Payment Initiation</h2><p>Browse a synthetic banking solution through document-style designs, structured datasets and knowledge graphs.</p><div class="actions"><button class="btn primary" data-page="Architecture Designs">Explore architecture</button><button class="btn" data-page="Knowledge Graphs">Open graph</button></div></div><h2>Architecture designs</h2><div class="grid4">${layers.map(k=>`<button class="card clickable" data-open="${k}"><div class="mini">${k} DESIGN</div><h3 style="margin-top:7px">${esc(data[k].name)}</h3><div class="metric">${data[k].records.length}</div><div class="mini">Example records · Open ↗</div></button>`).join('')}</div><div class="grid2" style="margin-top:9px"><div class="card"><h3>Explore the model</h3><p>Move between document, dataset and graph representations without changing your design data.</p><button class="btn" data-page="Data Architecture">Inspect datasets</button></div><div class="card"><h3>Governance</h3><p>Proposals, assumptions and unmapped items must be distinguished from approved design.</p><button class="btn" data-page="Reviews & Changes">Review proposals</button></div></div>`}
function designs(){return head('Architecture Designs','Human-readable designs, focused layer diagrams and record catalogs.')+tabs(layers,'layer')+tabs(['Document','Catalog','Diagram'],'view')+(state.view==='Document'?documentView(state.layer):state.view==='Catalog'?catalog(state.layer):diagram(state.layer))}
function datasets(){const arr=state.graphLayer==='All'?all:all.filter(r=>r.layer===state.graphLayer);const r=find(state.selected)||all[0];return head('Data Architecture','Explore model datasets, JSON records, metamodel types and schema validation context.')+`<div class="notice">In real SDEM the authoritative records live in four workspace datasets and the mappings registry. This page shows synthetic, simplified records only.</div><label>Dataset <select id="scope" class="btn"><option>All</option>${layers.map(k=>`<option ${state.graphLayer===k?'selected':''}>${k}</option>`).join('')}</select></label>`+tabs(['Table','JSON','Schema'],'dataView')+(state.dataView==='Table'?`<div class="tablewrap"><table><thead><tr><th>Layer</th><th>Name</th><th>Metamodel type</th><th>Related examples</th></tr></thead><tbody>${arr.map(v=>`<tr data-record="${v.id}"><td>${v.layer}</td><td><strong>${esc(v.name)}</strong><div class="mini">${esc(v.id)}</div></td><td>${esc(v.type)}</td><td>${v.links.length}</td></tr>`).join('')}</tbody></table></div>`:state.dataView==='JSON'?`<div class="card"><h2>${esc(r.id)} — JSON preview</h2><pre>${esc(JSON.stringify({id:r.id,type:r.layer+'.'+r.type,name:r.name,description:r.description,related_example_ids:r.links},null,2))}</pre><div class="mini">Not an exact schema-compliant SDEM export.</div></div>`:`<div class="card"><h2>A1–A4 dataset/schema context</h2>${layers.map(k=>`<div class="field"><label>${k} dataset</label>${k==='A1'?'a1-business.json':k==='A2'?'a2-service-domain.json':k==='A3'?'a3-application.json':'a4-technology.json'}</div>`).join('')}<p class="muted">Use actual SDEM schema and validation output in the implementation.</p></div>`)+`<div class="actions"><button class="btn" data-page="Knowledge Graphs">Knowledge graph</button><button class="btn" data-page="Architecture Designs">Read design</button></div>`}
function graph(){const chain=['PRC-PAY','SD-POI','APP-HUB','DEP-PROD'];const arr=state.graphLayer==='All'?chain:all.filter(r=>r.layer===state.graphLayer).map(r=>r.id);return head('Knowledge Graphs','Explore the federated A1–A4 model or focus on one architecture layer.')+`<label>Graph scope <select class="btn" id="scope"><option>All</option>${layers.map(k=>`<option ${state.graphLayer===k?'selected':''}>${k}</option>`).join('')}</select></label><div class="graph" style="margin-top:12px"><div class="chain">${arr.map((id,i)=>{const r=find(id);return `${i?'<div class="arrow">↓ illustrative relationship</div>':''}<button class="node" data-record="${r.id}"><div class="mini">${r.layer} · ${esc(r.type)}</div><strong>${esc(r.name)}</strong></button>`}).join('')}</div></div><div class="notice">Approved SDEM relationships must be distinguished from inferred/projected relationships. This illustrative chain does not establish any approved mappings.</div>`}
function trace(){const r=find(state.selected)||all[0];return head('Traceability & Impact','Start from an architecture record and inspect upstream/downstream relationships.')+`<label>Start record <select id="trace" class="btn">${all.map(x=>`<option value="${x.id}" ${r.id===x.id?'selected':''}>${x.layer} · ${esc(x.name)}</option>`).join('')}</select></label><div class="split" style="margin-top:15px"><div class="card"><h2>Related example records</h2>${r.links.map(id=>{const n=find(id);return `<button class="list-btn" data-record="${id}">${esc(n?.name||id)} ↗</button>`}).join('')||'No links in the sample.'}<p class="muted small">Real trace and change impact must be computed by the SDEM engine, not from arbitrary sample links.</p></div>${details()}</div>`}
function reviews(){return head('Reviews & Changes','Review proposed relationships, validation issues and governed changes.')+['Business process → BIAN domain','BIAN domain → Application','Application → Technology'].map(s=>`<div class="card"><strong>${s}</strong><div class="mini">Synthetic example · Proposed · Evidence not provided</div><p>Review the source and target records, inference rule, evidence requirements and approval history in the actual SDEM workbench.</p></div>`).join('')+`<div class="notice">Read-only: this prototype does not perform or simulate actual approval commands.</div>`}
function documents(){return head('Documents & Evidence','Read the four architecture designs and follow source evidence.')+`<div class="grid2">${layers.map(k=>`<div class="card"><div class="mini">${k} ARCHITECTURE DESIGN</div><h2>${esc(data[k].name)}</h2><p>${esc(data[k].intro)}</p><button class="btn" data-open="${k}">Read design ↗</button></div>`).join('')}</div><div class="notice">Source documents and generated design templates require agent validation and are not implemented by this standalone mockup.</div>`}
function frameworkOverview(){return head('SDEM Framework','Metamodel definitions, schema constraints, mapping rules and health.')+`<div class="grid2"><button class="card clickable" data-page="Metamodel Explorer"><h2>Metamodel Explorer</h2><p>Entity types, allowed relationship types and inheritance.</p></button><button class="card clickable" data-page="Relationship Rules"><h2>Relationship Rules</h2><p>Permitted cross-architecture mappings and evidence requirements.</p></button><button class="card clickable" data-page="Schemas & Configuration"><h2>Schemas & Configuration</h2><p>Authoritative schema and configuration files.</p></button><button class="card clickable" data-page="Engine Health"><h2>Engine Health</h2><p>Generated artifact freshness, validations and controls.</p></button></div>`}
function metamodel(){return head('Enterprise Metamodel','The current framework entity definitions, not the data of a specific solution.')+`<div class="notice">Illustrative subset only. The implementation must load the actual v0.18.0 metamodel, not hard-code the types shown here.</div><label>Layer <select id="metaScope" class="btn"><option>All</option>${layers.map(k=>`<option ${state.metaLayer===k?'selected':''}>${k}</option>`).join('')}</select></label><div class="grid2" style="margin-top:12px">${layers.filter(k=>state.metaLayer==='All'||state.metaLayer===k).map(k=>`<div class="card"><h2>${k} · ${esc(data[k].name)}</h2>${definitions[k].map(t=>`<span class="tag">${k}.${esc(t)}</span>`).join('')}<div class="actions"><button class="btn" data-page="Relationship Rules">Mapping rules ↗</button></div></div>`).join('')}</div>`}
function schemas(){return head('Schemas & Configuration','Metamodel schema definitions, active rules and workspace profiles.')+`<div class="grid2"><div class="card"><h2>Framework metamodel</h2><p>Definitions, attributes, relationship constraints and inference configurations.</p></div><div class="card"><h2>Workspace profile</h2><p>Supported schema extensions and domain-specific overrides.</p></div></div><div class="notice">Current settings must come from the installed SDEM configuration. No live settings are loaded here.</div>`}
function rules(){return head('Relationship & Mapping Rules','Visualize permissible mappings between A1–A4 and their evidence requirements.')+`<div class="graph"><div class="chain">${layers.map((k,i)=>`${i?'<div class="arrow">↓ permitted mapping categories</div>':''}<div class="node"><strong>${k} · ${esc(data[k].name)}</strong></div>`).join('')}</div></div><div class="notice">This is a conceptual orientation view, not an authoritative enumeration of the SDEM relationship registry. Build the actual view from SDEM metamodel and rule metadata.</div>`}
function health(){return head('Engine Health','Generated artifacts, validation, rules engine acceptance and controls.')+`<div class="grid2"><div class="card"><h2>CLI and engine</h2><p>Run actual checks through the SDEM Python implementation to populate this view.</p></div><div class="card"><h2>Snapshot freshness</h2><p>Generated HTML is an offline snapshot. Display the generation timestamp and graph build state.</p></div></div><div class="notice">No tests or live health checks are executed in this mockup.</div>`}
const pages={workspace:{Overview:overview,'Architecture Designs':designs,'Data Architecture':datasets,'Knowledge Graphs':graph,'Traceability & Impact':trace,'Reviews & Changes':reviews,'Documents & Evidence':documents},framework:{Overview:frameworkOverview,'Metamodel Explorer':metamodel,'Schemas & Configuration':schemas,'Relationship Rules':rules,'Engine Health':health}};
function render(){document.querySelectorAll('[data-context]').forEach(b=>b.classList.toggle('active',b.dataset.context===state.context));$('nav').innerHTML=`<div class="side-label">${state.context==='workspace'?'PAYMENT INITIATION':'FRAMEWORK CONSOLE'}</div>`+nav[state.context].map(s=>`<button class="nav ${state.page===s?'active':''}" data-page="${s}"><span>${icon[s]||'·'}</span>${s}</button>`).join('');$('main').innerHTML=pages[state.context][state.page]();$('where').textContent=(state.context==='workspace'?'Solution Workspace':'SDEM Framework')+' / '+state.page;bind()}
function bind(){document.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{state.context=b.dataset.context;state.page='Overview';render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.context='workspace';state.page='Architecture Designs';state.layer=b.dataset.open;state.view='Document';state.selected=data[state.layer].records[0].id;render()});document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{state.layer=b.dataset.layer;state.selected=data[state.layer].records[0].id;state.query='';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-dataview]').forEach(b=>b.onclick=()=>{state.dataView=b.dataset.dataview;render()});document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>selectRecord(b.dataset.record));const scope=$('scope');if(scope)scope.onchange=()=>{state.graphLayer=scope.value;render()};const meta=$('metaScope');if(meta)meta.onchange=()=>{state.metaLayer=meta.value;render()};const trace=$('trace');if(trace)trace.onchange=()=>{state.selected=trace.value;render()};const filter=$('filter');if(filter)filter.oninput=()=>{const start=filter.selectionStart;state.query=filter.value;render();const f=$('filter');if(f){f.focus();f.setSelectionRange(start,start)}}}
render();
})();
</script>
</body>
</html>
