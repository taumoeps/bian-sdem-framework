<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDEM Workbench — mockup from the Payments example</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--soft:#f6f8fa;--line:#dfe5eb;--text:#1f2933;--muted:#5f6c7b;--accent:#0f766e;--accent-soft:#e3f5f0;--good:#1f7a3a;--warn:#9a6700;--bad:#b42318;--info:#2563a8;--a1:#b46a2a;--a2:#326da9;--a3:#4b8742;--a4:#7852a0;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f151b;--panel:#151d25;--soft:#1b252f;--line:#2b3946;--text:#e3e9ef;--muted:#9aa8b6;--accent:#3fb8a8;--accent-soft:#16332f;--good:#5fc77d;--warn:#e0b44c;--bad:#f07a6e;--info:#7fb0ea}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:1440px;margin:auto;background:var(--panel);min-height:100vh;border-inline:1px solid var(--line)}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:16px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.segment{display:flex;gap:3px;background:var(--soft);padding:4px;border-radius:9px;border:1px solid var(--line)}.segment a{padding:6px 12px;border-radius:7px;color:var(--text);text-decoration:none}.segment a[aria-current=true]{background:var(--panel);box-shadow:0 1px 4px #0002;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr)}nav{border-right:1px solid var(--line);padding:12px 8px;background:var(--soft)}
nav .lbl{font-size:10px;letter-spacing:.08em;font-weight:800;color:var(--muted);margin:6px 10px 8px}
nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--text);text-decoration:none;margin-bottom:2px}nav a:hover{background:var(--accent-soft)}nav a[aria-current=page]{background:var(--accent-soft);font-weight:700;color:var(--accent)}
main{padding:20px 22px;min-width:0}.bread{font-size:12px;color:var(--muted)}h1{font-size:21px;margin:0 0 4px}h2{font-size:16px;margin:18px 0 8px}h3{font-size:14px;margin:12px 0 6px}.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}a.card{text-decoration:none;color:inherit;display:block}a.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px}.big{font-size:24px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}
.lay{border-left:4px solid var(--line)}.lay.A1{border-left-color:var(--a1)}.lay.A2{border-left-color:var(--a2)}.lay.A3{border-left-color:var(--a3)}.lay.A4{border-left-color:var(--a4)}
.badge{display:inline-block;border:1px solid currentColor;border-radius:5px;padding:0 6px;font-size:11px;font-weight:600;white-space:nowrap}
.b-good{color:var(--good)}.b-warn{color:var(--warn)}.b-bad{color:var(--bad)}.b-info{color:var(--info)}.b-muted{color:var(--muted)}
[role=tablist]{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px}
[role=tab]{border:0;background:none;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer}[role=tab][aria-selected=true]{border-bottom-color:var(--accent);font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}.list{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer}.list button:hover,.list button[aria-pressed=true]{background:var(--accent-soft)}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:8px}select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
pre{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:66vh}
.doc{max-width:820px}.doc h2{border-bottom:1px solid var(--line);padding-bottom:4px}.doc .note{background:var(--soft);color:var(--muted);padding:8px 10px;border-radius:6px}
.cmd{display:flex;gap:6px;align-items:flex-start;margin:6px 0}.cmd code{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;overflow-wrap:anywhere}.cmd button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;cursor:pointer}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}.tree li{margin:4px 0}.rel{font-size:11px;color:var(--muted)}
a.rec{color:var(--accent);text-decoration:none}a.rec:hover{text-decoration:underline}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;margin:2px;background:var(--soft)}
svg text{fill:var(--text);font-size:11px}svg .edge{stroke:var(--muted);stroke-width:1.1;fill:none;opacity:.75}svg .edge.x{stroke:var(--accent);stroke-width:1.6;opacity:1}svg .edge.in{stroke-dasharray:3 3;opacity:.45}
svg .node rect{fill:var(--panel);stroke:var(--line)}svg .node:hover rect,svg .node:focus rect{stroke:var(--accent);stroke-width:2}svg .node{cursor:pointer;outline:none}svg .band{fill:var(--soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
footer{border-top:1px solid var(--line);padding:8px 18px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav .lbl{display:none}nav a{white-space:nowrap}.split{grid-template-columns:1fr}main{padding:14px}}
</style>

ribute names its source, reasoning and confidence", "runs": "the test suite", "tested": "✅ · ✅"}, {"id": "CTL-12", "status": "built", "area": "7 Sources", "control": "Every confidence rating follows the single confidence rule", "runs": "sdem-confidence --check", "tested": "✅ · ✅"}, {"id": "CTL-13", "status": "built", "area": "platform", "control": "Every generated document, diagram and schema matches the records", "runs": "CI", "tested": "✅ · ✅"}, {"id": "CTL-14", "status": "built", "area": "platform", "control": "The owner's high-level metamodel specification is unchanged", "runs": "the test suite", "tested": "✅ · ✅"}, {"id": "CTL-15", "status": "built", "area": "platform", "control": "A graph store is only written from data that passes every check; a failed build keeps the last good store; every build is logged", "runs": "sdem-graph build", "tested": "✅ · ✅"}, {"id": "CTL-16", "status": "built", "area": "platform", "control": "A projected design from file-based planning (`sdem aid project`, `PRJ-`/`DSN-` records) never enters an architecture dataset, the registry or a real graph store, and a projected link is never approved. Records `sdem aid` infers into a workspace (`AID-` records) are marked `inferred` — with source, reasoning and confidence — and keep the mark: a person confirms or rejects each (`sdem aid confirm|reject`); their connections are only proposals, approved by a person with evidence, so nothing inferred is followed by trace or impact until approved.", "runs": "sdem-graph check; sdem-validate; sdem-graph build", "tested": "✅ · ✅"}, {"id": "CTL-17", "status": "built", "area": "platform", "control": "Every projected element carries its projection provenance, is never above medium confidence (never above low when its evidence is name-only), and never invents a BIAN element", "runs": "sdem-aid project; sdem-aid check", "tested": "✅ · ✅"}, {"id": "CTL-19", "status": "built", "area": "platform", "control": "Layer ownership (agent platform): a change set c   <h2>Evidence behind approved connections</h2><div class="tw"><table><thead><tr><th>Kind</th><th>Reference</th><th>Supports</th></tr></thead><tbody>${Object.entries(ev).sort().flatMap(([k,refs])=>refs.map(([ref,id])=>`<tr><td>${esc(k)}</td><td>${esc(ref)}</td><td>${esc(id)}</td></tr>`)).join('')}</tbody></table></div>`}
/* ---------- SDEM framework ---------- */
function typeCard(t){if(!t)return'';return `<div class="card" style="margin-bottom:10px"><div class="small muted">${esc(t.layer)} · ${esc(t.source||'')}${t.abstract?' · abstract':''}${t.extends.length?' · extends '+t.extends.map(esc).join(' → '):''}</div><h3>${esc(t.type)}</h3><p class="small">${esc(t.definition)}</p>
  ${t.attributes.length?`<div class="tw" style="max-height:none"><table><thead><tr><th>Attribute</th><th>Type</th><th>Required</th><th>Allowed / refers to</th></tr></thead><tbody>${t.attributes.map(a=>`<tr><td>${esc(a.name)}${a.deprecated?' '+badge('deprecated','warn'):''}</td><td>${esc(a.type)}</td><td>${a.required?'yes':''}</td><td class="small">${esc((a.allowed_values||[]).join(', ')||(a.refers_to||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">no attributes of its own</p>'}
  ${t.links_out.length?`<p class="small"><strong>Links inside the layer:</strong> ${[...new Set(t.links_out.map(x=>x.kind+' → '+x.to))].map(esc).join('; ')}</p>`:''}${t.cross.length?`<p class="small"><strong>To other layers:</strong> ${t.cross.map(c=>`${esc(c.relationship)} (${c.direction}) ${esc(c.other_end)} — evidence: ${esc(c.evidence_needed.join(', '))}`).join('; ')}</p>`:''}</div>`}
function fwOverview(){const n=l=>F.types.filter(t=>t.layer===l).length;
  return head('SDEM Framework','What the metamodel allows — not the data of a solution.')+`<div class="grid">${LAYERS.map(l=>`<a class="card lay ${l}" href="#fw/metamodel/${l}"><div class="small muted">${l}</div><h3>${esc(TITLES[l])}</h3><div class="big">${n(l)}</div><div class="small muted">entity types</div></a>`).join('')}</div>
  <div class="grid" style="margin-top:10px"><a class="card" href="#fw/rules/within"><div class="big">${F.within.length}</div><div class="small">links allowed inside a layer</div></a><a class="card" href="#fw/rules/cross"><div class="big">${F.cross.length}</div><div class="small">relationships between layers, each with its evidence</div></a><a class="card" href="#fw/health"><div class="big">${F.controls.length}</div><div class="small">controls, where they run, last tested</div></a><a class="card" href="#fw/schemas"><div class="big">${F.schemas.length}</div><div class="small">generated entity schemas</div></a></div>`}
function metamodel(r){const l=LAYERS.includes(r.a)?r.a:'',sel=TYPE[r.a]?TYPE[r.a]:null,layer=sel?sel.layer:(l||'A1');const ts=F.types.filter(t=>t.layer===layer);const cur=sel||ts[0];
  return head('Metamodel Explorer',`Metamodel ${F.version}: every entity type, its attributes, inheritance and allowed links.`)+tabs(LAYERS.map(x=>[`#fw/metamodel/${x}`,`${TITLES[x]} (${F.types.filter(t=>t.layer===x).length})`,x]),layer)+
  `<div class="split"><div><input type="search" id="filter" placeholder="Find a type" aria-label="Find a type"><div class="list">${ts.map(t=>`<button type="button" data-find="${esc(t.type+' '+t.definition)}" aria-pressed="${t.type===cur.type}" onclick="go('#fw/metamodel/${encodeURIComponent(t.type)}')"><strong>${esc(t.type.split('.')[1])}</strong>${t.abstract?' '+badge('abstract','muted'):''}<div class="small muted">${esc(t.definition.slice(0,90))}</div></button>`).join('')}</div></div><div>${typeCard(cur)}<p class="small"><a class="rec" href="#ws/designs/${cur.layer}/catalog">Records of this layer in the workspace →</a></p></div></div>`}
function schemas(){return head('Schemas & Configuration','The installed configuration: metamodel version and freeze, BIAN release, the organisation profile and the generated schemas.')+
  `<div class="grid"><div class="card"><h3>Metamodel</h3><p>${esc(F.version)} · frozen ${esc(F.frozen_at)} by ${esc(F.frozen_by)}</p></div><div class="card"><h3>BIAN</h3><p class="small">${esc(F.bian)}</p></div><div class="card"><h3>Organisation profile</h3><p class="small">${F.profile?'this workspace has <code>sdem-profile.json</code> — <code>sdem profile show</code>':'none in this workspace — SDEM\'s core only'}</p></div></div>
  <h2>Generated entity schemas (${F.schemas.length})</h2><div class="tw"><table><thead><tr><th>File</th></tr></thead><tbody>${F.schemas.map(s=>`<tr><td><code>${esc(s)}</code></td></tr>`).join('')}</tbody></table></div>`}
function rules(r){const v=r.a==='cross'?'cross':'within';
  const body=v==='within'?`<input type="search" id="filter" placeholder="Find a rule by type, kind or id" aria-label="Find a rule"><div class="tw"><table><thead><tr><th>Id</th><th>Layer</th><th>Source</th><th>Kind</th><th>Target</th><th>Basis</th></tr></thead><tbody>${F.within.map(c=>`<tr data-find="${esc([c.id,c.level,c.source_type,c.kind,c.target_type].join(' '))}"><td>${esc(c.id)}</td><td>${esc(c.level)}</td><td>${typeLink(c.source_type)}</td><td>${esc(c.kind)}</td><td>${typeLink(c.target_type)}</td><td class="small">${esc(c.basis||'')}</td></tr>`).join('')}</tbody></table></div>`:
   `<div class="tw"><table><thead><tr><th>Relationship</th><th>From</th><th>To</th><th>Cardinality</th><th>Authority</th><th>Evidence a person must give</th></tr></thead><tbody>${F.cross.map(c=>`<tr><td><strong>${esc(c.relationship)}</strong><div class="small muted">${esc(c.direction_semantics||'')}</div></td><td>${typeLink(c.source_type)}</td><td>${typeLink(c.target_type)}</td><td>${esc(c.cardinality)}</td><td class="small">${esc(c.authority)}</td><td class="small">${esc((c.required_evidence||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
  return head('Relationship Rules','The links the metamodel allows inside each layer, and the governed relationships between layers with the evidence each needs.')+tabs([['#fw/rules/within',`Inside a layer (${F.within.length})`,'within'],['#fw/rules/cross',`Between layers (${F.cross.length})`,'cross']],v)+body}
function health(){return head('Engine Health','Generated files, the controls and where each is tested.')+`<div class="card"><h3>Generated files</h3><p>${badge(F.model_check,F.model_check.includes('current')?'good':'warn')} — <code>sdem model check</code></p></div>
  <h2>Controls (${F.controls.length})</h2><div class="tw"><table><thead><tr><th>Id</th><th>Control</th><th>Runs in</th><th>Tested</th><th>Status</th></tr></thead><tbody>${F.controls.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.control)}</td><td class="small">${esc(c.runs)}</td><td>${esc(c.tested)}</td><td>${esc(c.status)}</td></tr>`).join('')}</tbody></table></div>`}
window.addEventListener('hashchange',()=>{render();$('#main').focus({preventScroll:true})});
if(!location.hash) location.replace('#ws/overview'); render();
</script>
</body>
</html>
